events {}
http {
  include /etc/nginx/mime.types;
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log;
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }
  server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/certs/prod.crt;
    ssl_certificate_key /etc/nginx/certs/prod.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    # PROD MediConnect - portail patients public
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    location / { try_files $uri $uri/ =404; }
    # Espace medecin: protege par Keycloak en cible finale.
    # PoC actuel: page login qui renvoie vers Keycloak.
    location /medecin { alias /usr/share/nginx/html/medecin; }
  }
}
